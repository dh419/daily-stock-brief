name: Generate and Publish Daily Stock Brief

on:
  schedule:
    # 오전 07:00 ~ 08:30 KST (UTC 22:00 ~ 23:30) 10분 주기 체크
    - cron: '*/10 22 * * *'
    - cron: '0,10,20,30 23 * * *'
    # 오후 19:00 ~ 20:30 KST (UTC 10:00 ~ 11:30) 10분 주기 체크
    - cron: '*/10 10 * * *'
    - cron: '0,10,20,30 11 * * *'
  workflow_dispatch:
    inputs:
      session:
        description: '브리핑 회차 선택 (morning: 오전 / evening: 오후)'
        required: true
        default: 'morning'
        type: choice
        options:
          - 'morning'
          - 'evening'
      model:
        description: 'Gemini 모델 선택'
        required: false
        default: 'gemini-4-hydrogen'
        type: choice
        options:
          - 'gemini-4-hydrogen'
          - 'gemini-3.8-flash'
          - 'gemini-3.5-flash-lite'
          - 'gemini-3.5-flash'

jobs:
  generate-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Google Drive SDK
        run: |
          python -m pip install --upgrade pip
          pip install google-api-python-client google-auth

      - name: Determine Session
        id: determine
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "session=${{ inputs.session }}" >> $GITHUB_OUTPUT
          else
            KST_HOUR=$(TZ=Asia/Seoul date +%H | sed 's/^0//')
            if [ "$KST_HOUR" -ge 6 ] && [ "$KST_HOUR" -lt 14 ]; then
              echo "session=morning" >> $GITHUB_OUTPUT
            else
              echo "session=evening" >> $GITHUB_OUTPUT
            fi
          fi

      - name: Fetch JSON from Google Drive & Render Stock Brief
        env:
          GDRIVE_SA_KEY: ${{ secrets.GDRIVE_SA_KEY }}
        run: |
          python scripts/sync_from_gdrive.py --session ${{ steps.determine.outputs.session }}

      - name: Update Hub Index Data
        run: |
          python scripts/update_index.py

      - name: Commit and Push to Pages
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add docs/ hub-data.json audit_history.json
          git diff --staged --quiet || (git commit -m "chore(stock): publish ${{ steps.determine.outputs.session }} brief [$(date +%Y-%m-%d)]" && git push)
