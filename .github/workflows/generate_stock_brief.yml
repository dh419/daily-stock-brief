name: Generate and Publish Daily Stock Brief

on:
  schedule:
    # 오전 월~토 07:00 ~ 08:30 KST (UTC 일~금 22:00 ~ 23:30) 10분 주기 체크 (일요일 오전 제외)
    - cron: '*/10 22 * * 0-5'
    - cron: '0,10,20,30 23 * * 0-5'
    # 오후 일·월~금 20:00 ~ 21:30 KST (UTC 일~금 11:00 ~ 12:30) 10분 주기 체크 (토요일 저녁 제외)
    - cron: '*/10 11 * * 0-5'
    - cron: '0,10,20,30 12 * * 0-5'
  workflow_dispatch:
    inputs:
      session:
        description: '브리핑 회차 선택 (morning: 오전 / evening: 오후)'
        required: true
        default: 'morning'
        type: choice
        options:
          - 'morning'
          - 'evening'
      model:
        description: 'Gemini 모델 선택'
        required: false
        default: 'gemini-4-hydrogen'
        type: choice
        options:
          - 'gemini-4-hydrogen'
          - 'gemini-3.8-flash'
          - 'gemini-3.5-flash-lite'
          - 'gemini-3.5-flash'

jobs:
  generate-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Google Drive SDK
        run: |
          python -m pip install --upgrade pip
          pip install google-api-python-client google-auth

      - name: Determine Session
        id: determine
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_SESSION: ${{ inputs.session }}
          SCHEDULE_CRON: ${{ github.event.schedule }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "session=$INPUT_SESSION" >> "$GITHUB_OUTPUT"
          elif [ "$SCHEDULE_CRON" = "*/10 22 * * 0-5" ] || [ "$SCHEDULE_CRON" = "0,10,20,30 23 * * 0-5" ]; then
            echo "session=morning" >> "$GITHUB_OUTPUT"
          elif [ "$SCHEDULE_CRON" = "*/10 11 * * 0-5" ] || [ "$SCHEDULE_CRON" = "0,10,20,30 12 * * 0-5" ]; then
            echo "session=evening" >> "$GITHUB_OUTPUT"
          else
            KST_HOUR=$((10#$(TZ=Asia/Seoul date +%H)))
            if [ "$KST_HOUR" -ge 7 ] && [ "$KST_HOUR" -lt 19 ]; then
              echo "session=morning" >> "$GITHUB_OUTPUT"
            else
              echo "session=evening" >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: Fetch JSON from Google Drive & Render Stock Brief
        env:
          GDRIVE_SA_KEY: ${{ secrets.GDRIVE_SA_KEY }}
        run: |
          python scripts/sync_from_gdrive.py --session ${{ steps.determine.outputs.session }}

      - name: Update Hub Index Data
        run: |
          python scripts/update_index.py

      - name: Commit and Push to Pages
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add docs/ hub-data.json audit_history.json robots.txt index.html
          git diff --staged --quiet || (git commit -m "chore(stock): publish ${{ steps.determine.outputs.session }} brief [$(date +%Y-%m-%d)]" && git push)