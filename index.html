<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="robots" content="noindex, nofollow">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Daily Stock Brief Hub | 일 2회 AI 정량 주식 예측 허브</title>
  <style>
    :root {
      --bg: #090d16;
      --sidebar-bg: #0f172a;
      --border: #1e293b;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --accent: #3b82f6;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Pretendard', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      height: 100vh;
      overflow: hidden;
    }
    /* Sidebar */
    .sidebar {
      width: 320px;
      background: var(--sidebar-bg);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
      transition: transform 0.2s ease;
      z-index: 50;
    }
    .sidebar-header {
      padding: 16px 20px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .brand { font-size: 1.1rem; font-weight: 800; color: #fff; display: flex; align-items: center; gap: 8px; }
    .brand span { font-size: 0.75rem; background: rgba(59, 130, 246, 0.2); color: #60a5fa; padding: 2px 6px; border-radius: 4px; }
    
    .filter-tabs {
      display: flex;
      padding: 10px 14px;
      gap: 6px;
      border-bottom: 1px solid var(--border);
      background: #0b1120;
    }
    .filter-btn {
      flex: 1;
      padding: 6px 0;
      font-size: 0.8rem;
      font-weight: 700;
      background: transparent;
      border: 1px solid transparent;
      color: var(--text-muted);
      border-radius: 6px;
      cursor: pointer;
    }
    .filter-btn.active {
      background: #1e293b;
      color: #fff;
      border-color: #334155;
    }

    .report-list {
      flex: 1;
      overflow-y: auto;
      padding: 10px 12px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .report-item {
      padding: 12px 14px;
      border-radius: 10px;
      background: #131d31;
      border: 1px solid transparent;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .report-item:hover { background: #1a2744; border-color: #2563eb; }
    .report-item.active { background: #1e293b; border-color: #3b82f6; box-shadow: 0 0 12px rgba(59, 130, 246, 0.2); }
    .item-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px; }
    .item-date { font-size: 0.82rem; font-weight: 700; color: #e2e8f0; }
    .item-session {
      font-size: 0.72rem;
      font-weight: 800;
      padding: 2px 6px;
      border-radius: 4px;
    }
    .session-morning { background: rgba(245, 158, 11, 0.2); color: #fbbf24; }
    .session-evening { background: rgba(99, 102, 241, 0.2); color: #a5b4fc; }
    .item-title {
      font-size: 0.84rem;
      color: #cbd5e1;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* Main Frame Area */
    .main-wrap {
      flex: 1;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
      position: relative;
    }
    .top-bar {
      height: 46px;
      background: var(--sidebar-bg);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 12px;
      gap: 8px;
    }
    .menu-btn {
      display: none;
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 6px;
      color: #fff;
      font-size: 0.9rem;
      font-weight: 700;
      padding: 4px 10px;
      cursor: pointer;
      white-space: nowrap;
      flex-shrink: 0;
    }
    #activeTitle {
      font-size: 0.85rem;
      font-weight: 700;
      color: #e2e8f0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      flex: 1;
      min-width: 0;
    }
    .top-actions { display: flex; gap: 6px; align-items: center; flex-shrink: 0; }
    .top-btn {
      font-size: 0.75rem;
      font-weight: 700;
      padding: 5px 8px;
      border-radius: 6px;
      background: #1e293b;
      color: #cbd5e1;
      border: 1px solid #334155;
      text-decoration: none;
      cursor: pointer;
      white-space: nowrap;
    }
    .top-btn:hover { background: #334155; color: #fff; }
    
    iframe#viewer {
      flex: 1;
      width: 100%;
      height: 100%;
      border: none;
      background: var(--bg);
    }

    @media (max-width: 768px) {
      .menu-btn { display: block; }
      .sidebar {
        position: absolute;
        top: 0;
        bottom: 0;
        left: 0;
        transform: translateX(-100%);
        box-shadow: 10px 0 30px rgba(0,0,0,0.8);
      }
      .sidebar.open { transform: translateX(0); }
    }
  </style>
</head>
<body>
  <!-- Sidebar -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <div class="brand">📈 StockBrief <span>AI Q-Model</span></div>
    </div>
    <div class="filter-tabs">
      <button class="filter-btn active" onclick="filterReports('all', this)">전체</button>
      <button class="filter-btn" onclick="filterReports('morning', this)">개장 (07:00)</button>
      <button class="filter-btn" onclick="filterReports('evening', this)">마감 (19:00)</button>
    </div>
    <div class="report-list" id="reportList"></div>
  </aside>

  <!-- Main View Area -->
  <div class="main-wrap">
    <div class="top-bar">
      <button class="menu-btn" onclick="toggleSidebar()">☰</button>
      <div id="activeTitle">로딩 중...</div>
      <div class="top-actions">
        <button class="top-btn" onclick="copyCurrentUrl()">🔗 복사</button>
        <a id="rawLink" class="top-btn" target="_blank">↗</a>
      </div>
    </div>
    <iframe id="viewer" src="about:blank"></iframe>
  </div>

  <script>
    let hubData = [];
    let currentFilter = 'all';

    async function loadHub() {
      try {
        const res = await fetch('hub-data.json?t=' + Date.now());
        hubData = await res.json();
        renderSidebar();
        
        // Deep linking via URL hash (#YYYY-MM-DD-session)
        const hash = window.location.hash.replace('#', '');
        if (hash) {
          const match = hubData.find(item => item.id === hash);
          if (match) {
            selectReport(match.id, match.path, match.title);
            return;
          }
        }
        if (hubData.length > 0) {
          selectReport(hubData[0].id, hubData[0].path, hubData[0].title);
        }
      } catch (err) {
        console.error('Failed to load hub data:', err);
      }
    }

    function formatDateShort(dateStr) {
      const days = ['일', '월', '화', '수', '목', '금', '토'];
      const d = new Date(dateStr + 'T00:00:00');
      if (isNaN(d)) return dateStr;
      const m = dateStr.split('-')[1];
      const day = dateStr.split('-')[2];
      return `${m}/${day} (${days[d.getDay()]})`;
    }

    function renderSidebar() {
      const container = document.getElementById('reportList');
      container.innerHTML = '';
      hubData.forEach(item => {
        if (currentFilter !== 'all' && item.session !== currentFilter) return;
        const el = document.createElement('div');
        el.className = 'report-item';
        el.id = 'item-' + item.id;
        el.onclick = () => {
          selectReport(item.id, item.path, item.title);
          if (window.innerWidth <= 768) toggleSidebar();
        };
        const dateLabel = formatDateShort(item.date);
        el.innerHTML = `
          <div class="item-top" style="margin-bottom:0;">
            <span class="item-date" style="font-size:0.9rem;">${dateLabel}</span>
            <span class="item-session ${item.session === 'morning' ? 'session-morning' : 'session-evening'}">
              ${item.session === 'morning' ? '개장' : '마감'}
            </span>
          </div>
        `;
        container.appendChild(el);
      });
    }

    function filterReports(type, btn) {
      currentFilter = type;
      document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      renderSidebar();
    }

    function selectReport(id, path, title) {
      window.location.hash = id;
      document.getElementById('viewer').src = path + '?t=' + Date.now();
      document.getElementById('activeTitle').textContent = title;
      document.getElementById('rawLink').href = path + '?t=' + Date.now();
      document.querySelectorAll('.report-item').forEach(el => el.classList.remove('active'));
      const activeEl = document.getElementById('item-' + id);
      if (activeEl) activeEl.classList.add('active');
    }

    function toggleSidebar() {
      document.getElementById('sidebar').classList.toggle('open');
    }

    function copyCurrentUrl() {
      navigator.clipboard.writeText(window.location.href);
      alert('현재 리포트의 단축 공유 URL이 복사되었습니다!');
    }

    loadHub();
  </script>
</body>
</html>
