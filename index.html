<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="robots" content="noindex, nofollow" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>주식 브리핑 허브</title>
  <script>
    try {
      var t = localStorage.getItem("theme");
      if (t) document.documentElement.dataset.theme = t;
    } catch (e) {}
  </script>
  <style>
    :root {
      --bg: #f8fafc;
      --surface: #ffffff;
      --surface-2: #f1f5f9;
      --text: #0f172a;
      --muted: #64748b;
      --border: #e2e8f0;
      --accent: #2563eb;
      --accent-soft: #eff6ff;
      --sidebar-w: 300px;
    }
    [data-theme="dark"] {
      --bg: #090d16;
      --surface: #0f172a;
      --surface-2: #1e293b;
      --text: #f8fafc;
      --muted: #94a3b8;
      --border: #1e293b;
      --accent: #3b82f6;
      --accent-soft: #172554;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Pretendard", "Segoe UI", "Noto Sans KR", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .topbar {
      height: 56px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 0 16px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      z-index: 20;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }
    .brand h1 {
      margin: 0;
      font-size: 1.05rem;
      font-weight: 700;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .actions {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
    }
    .btn {
      background: var(--surface-2);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 6px 11px;
      font-size: 0.84rem;
      cursor: pointer;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      white-space: nowrap;
      flex-shrink: 0;
      transition: border-color 0.15s ease, background 0.15s ease;
    }
    .icon-btn {
      width: 34px;
      height: 34px;
      padding: 0;
      font-size: 0.95rem;
    }
    .btn:hover { border-color: var(--accent); }
    .btn svg { width: 16px; height: 16px; display: block; }
    .menu-btn { display: inline-flex; }
    @media (max-width: 600px) {
      .topbar { padding: 0 10px; gap: 8px; }
      .brand { gap: 6px; }
      .brand h1 { font-size: 0.95rem; }
      .actions { gap: 4px; }
      .btn { padding: 5px 8px; font-size: 0.78rem; }
      .icon-btn { width: 32px; height: 32px; padding: 0; }
    }
    .layout {
      flex: 1;
      display: flex;
      min-height: 0;
      position: relative;
    }
    .sidebar {
      width: var(--sidebar-w);
      flex-shrink: 0;
      background: var(--surface);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      min-height: 0;
      z-index: 15;
      overflow: hidden;
      transition: width 0.2s ease, transform 0.2s ease;
    }
    body.sidebar-collapsed .sidebar {
      width: 0;
      border-right: 0;
    }
    .filter-tabs {
      display: flex;
      padding: 10px 12px;
      gap: 6px;
      border-bottom: 1px solid var(--border);
      min-width: var(--sidebar-w);
    }
    .filter-btn {
      flex: 1;
      padding: 6px 0;
      font-size: 0.78rem;
      font-weight: 700;
      background: transparent;
      border: 1px solid transparent;
      color: var(--muted);
      border-radius: 6px;
      cursor: pointer;
    }
    .filter-btn.active {
      background: var(--surface-2);
      color: var(--text);
      border-color: var(--border);
    }
    .nav-scroll {
      flex: 1;
      overflow-y: auto;
      padding: 10px 8px 20px;
      min-width: var(--sidebar-w);
    }
    .month-group { margin-bottom: 6px; }
    .month-toggle {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: transparent;
      border: 0;
      border-radius: 6px;
      padding: 7px 10px;
      font-size: 0.78rem;
      font-weight: 700;
      color: var(--muted);
      letter-spacing: 0.03em;
      cursor: pointer;
      text-align: left;
    }
    .month-toggle:hover { background: var(--surface-2); color: var(--text); }
    .month-toggle-meta {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 0.72rem;
    }
    .month-items { padding-top: 2px; }
    .month-group.folded .month-items { display: none; }
    .nav-item {
      display: block;
      width: 100%;
      text-align: left;
      background: transparent;
      border: 1px solid transparent;
      border-radius: 8px;
      padding: 9px 10px;
      margin-bottom: 4px;
      color: var(--text);
      cursor: pointer;
      transition: background 0.12s ease, border-color 0.12s ease;
    }
    .nav-item:hover { background: var(--surface-2); }
    .nav-item.active {
      background: var(--accent-soft);
      border-color: var(--accent);
    }
    .item-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .item-date { font-size: 0.88rem; font-weight: 600; }
    .item-session {
      font-size: 0.72rem;
      font-weight: 700;
      padding: 2px 7px;
      border-radius: 4px;
    }
    .session-morning { background: rgba(245, 158, 11, 0.18); color: #d97706; }
    [data-theme="dark"] .session-morning { color: #fbbf24; }
    .session-evening { background: rgba(99, 102, 241, 0.18); color: #4f46e5; }
    [data-theme="dark"] .session-evening { color: #a5b4fc; }
    .viewer {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-width: 0;
      background: var(--bg);
    }
    .viewer iframe {
      flex: 1;
      width: 100%;
      height: 100%;
      border: 0;
      background: var(--bg);
    }
    .empty {
      padding: 32px 16px;
      text-align: center;
      color: var(--muted);
      font-size: 0.9rem;
    }
    .backdrop {
      display: none;
      position: fixed;
      inset: 56px 0 0 0;
      background: rgba(0, 0, 0, 0.45);
      z-index: 14;
    }
    .toast {
      position: fixed;
      bottom: 20px;
      right: 20px;
      z-index: 50;
      background: var(--accent);
      color: #fff;
      font-size: 0.82rem;
      font-weight: 600;
      padding: 8px 14px;
      border-radius: 8px;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.25);
      opacity: 0;
      transform: translateY(10px);
      transition: opacity 0.2s ease, transform 0.2s ease;
      pointer-events: none;
    }
    .toast.show {
      opacity: 1;
      transform: translateY(0);
    }
    @media (max-width: 820px) {
      body.sidebar-collapsed .sidebar { width: var(--sidebar-w); }
      .sidebar {
        position: fixed;
        top: 56px;
        bottom: 0;
        left: 0;
        transform: translateX(-100%);
      }
      .sidebar.open { transform: translateX(0); }
      .backdrop.open { display: block; }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <button class="btn menu-btn" id="menuToggle" aria-label="사이드바 토글" aria-expanded="true">☰ 사이드바</button>
      <h1>주식 브리핑 허브</h1>
    </div>
    <div class="actions">
      <button class="btn icon-btn" id="copyBtn" title="URL 복사" aria-label="URL 복사">
        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"/></svg>
      </button>
      <a class="btn icon-btn" id="openNewTab" href="#" target="_blank" rel="noopener" title="새 탭 열기" aria-label="새 탭 열기" style="display:none;">
        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"/></svg>
      </a>
      <button class="btn icon-btn" id="themeToggle" title="라이트/다크 전환" aria-label="라이트/다크 전환">🌙</button>
      <a class="btn icon-btn" href="https://github.com/dh419/daily-stock-brief" target="_blank" rel="noopener" title="GitHub 저장소" aria-label="GitHub 저장소">
        <svg fill="currentColor" viewBox="0 0 24 24"><path fill-rule="evenodd" clip-rule="evenodd" d="M12 2C6.477 2 2 6.484 2 12.017c0 4.425 2.865 8.18 6.839 9.504.5.092.682-.217.682-.483 0-.237-.008-.868-.013-1.703-2.782.605-3.369-1.343-3.369-1.343-.454-1.158-1.11-1.466-1.11-1.466-.908-.62.069-.608.069-.608 1.003.07 1.53 1.032 1.53 1.032.892 1.53 2.341 1.088 2.91.832.092-.647.35-1.088.636-1.338-2.22-.253-4.555-1.113-4.555-4.951 0-1.093.39-1.988 1.029-2.688-.103-.253-.446-1.272.098-2.65 0 0 .84-.27 2.75 1.026A9.564 9.564 0 0112 6.844c.85.004 1.705.115 2.504.337 1.909-1.296 2.747-1.027 2.747-1.027.546 1.379.202 2.398.1 2.651.64.7 1.028 1.595 1.028 2.688 0 3.848-2.339 4.695-4.566 4.943.359.309.678.92.678 1.855 0 1.338-.012 2.419-.012 2.747 0 .268.18.58.688.482A10.019 10.019 0 0022 12.017C22 6.484 17.522 2 12 2z"/></svg>
      </a>
    </div>
  </header>

  <div class="layout">
    <aside class="sidebar" id="sidebar" aria-label="브리핑 목록 사이드바">
      <div class="filter-tabs">
        <button type="button" class="filter-btn active" data-filter="all">전체</button>
        <button type="button" class="filter-btn" data-filter="morning">개장 (07:00)</button>
        <button type="button" class="filter-btn" data-filter="evening">마감 (19:00)</button>
      </div>
      <div class="nav-scroll" id="reportList">
        <div class="empty">불러오는 중...</div>
      </div>
    </aside>
    <div class="backdrop" id="backdrop"></div>
    <main class="viewer">
      <iframe id="viewer" title="주식 브리핑 뷰어" src="about:blank"></iframe>
    </main>
  </div>

  <div class="toast" id="toast">공유 URL이 복사되었습니다.</div>

  <script>
    (function () {
      var themeBtn = document.getElementById("themeToggle");
      function syncThemeBtn() {
        var cur = document.documentElement.dataset.theme || "dark";
        document.documentElement.dataset.theme = cur;
        themeBtn.textContent = cur === "dark" ? "☀️" : "🌙";
        themeBtn.title = cur === "dark" ? "라이트 모드로 전환" : "다크 모드로 전환";
      }
      themeBtn.addEventListener("click", function () {
        var next = document.documentElement.dataset.theme === "dark" ? "light" : "dark";
        document.documentElement.dataset.theme = next;
        try { localStorage.setItem("theme", next); } catch (e) {}
        syncThemeBtn();
      });
      syncThemeBtn();

      var sidebar = document.getElementById("sidebar");
      var backdrop = document.getElementById("backdrop");
      var menuToggle = document.getElementById("menuToggle");
      var isMobile = function () { return window.innerWidth <= 820; };

      function toggleSidebar(force) {
        if (isMobile()) {
          var open = typeof force === "boolean" ? force : !sidebar.classList.contains("open");
          sidebar.classList.toggle("open", open);
          backdrop.classList.toggle("open", open);
          menuToggle.setAttribute("aria-expanded", String(open));
        } else {
          var collapsed = typeof force === "boolean" ? !force : !document.body.classList.contains("sidebar-collapsed");
          document.body.classList.toggle("sidebar-collapsed", collapsed);
          menuToggle.setAttribute("aria-expanded", String(!collapsed));
        }
      }
      menuToggle.addEventListener("click", function () { toggleSidebar(); });
      backdrop.addEventListener("click", function () { toggleSidebar(false); });

      var toastEl = document.getElementById("toast");
      var toastTimer = null;
      function showToast(msg) {
        toastEl.textContent = msg;
        toastEl.classList.add("show");
        clearTimeout(toastTimer);
        toastTimer = setTimeout(function () { toastEl.classList.remove("show"); }, 2200);
      }

      document.getElementById("copyBtn").addEventListener("click", function () {
        navigator.clipboard.writeText(window.location.href)
          .then(function () { showToast("공유 URL이 복사되었습니다."); })
          .catch(function () { showToast("URL 복사에 실패했습니다."); });
      });

      var hubData = [];
      var currentFilter = "all";
      var activeId = "";
      var foldedMonths = {};
      var reportList = document.getElementById("reportList");
      var viewer = document.getElementById("viewer");
      var openNewTab = document.getElementById("openNewTab");

      function formatDateShort(dateStr) {
        var days = ["일", "월", "화", "수", "목", "금", "토"];
        var d = new Date(dateStr + "T00:00:00");
        if (isNaN(d)) return dateStr;
        var parts = dateStr.split("-");
        return parts[1] + "/" + parts[2] + " (" + days[d.getDay()] + ")";
      }

      function selectReport(item) {
        if (!item) return;
        activeId = item.id;
        try { history.replaceState(null, "", "#" + item.id); } catch (e) {}
        var url = item.path + "?t=" + Date.now();
        viewer.src = url;
        openNewTab.href = item.path;
        openNewTab.style.display = "inline-flex";
        Array.prototype.forEach.call(reportList.querySelectorAll(".nav-item"), function (el) {
          el.classList.toggle("active", el.dataset.id === activeId);
        });
        if (isMobile()) toggleSidebar(false);
      }

      function renderSidebar() {
        var filtered = hubData.filter(function (item) {
          return currentFilter === "all" || item.session === currentFilter;
        });
        if (!filtered.length) {
          reportList.innerHTML = '<div class="empty">표시할 브리핑이 없습니다.</div>';
          return;
        }
        var groups = {};
        filtered.forEach(function (item) {
          var m = item.month || (item.date ? item.date.slice(0, 7) : "기타");
          if (!groups[m]) groups[m] = [];
          groups[m].push(item);
        });
        var months = Object.keys(groups).sort().reverse();
        var latestMonth = months[0];
        var html = "";
        months.forEach(function (m) {
          if (typeof foldedMonths[m] === "undefined") {
            foldedMonths[m] = m !== latestMonth;
          }
          var isFolded = foldedMonths[m];
          html += '<div class="month-group' + (isFolded ? " folded" : "") + '" data-month="' + m + '">';
          html += '<button type="button" class="month-toggle" aria-expanded="' + String(!isFolded) + '">' +
            '<span>' + m + '</span>' +
            '<span class="month-toggle-meta"><span>' + groups[m].length + '</span><span class="chev">' + (isFolded ? "▸" : "▾") + '</span></span>' +
          '</button>';
          html += '<div class="month-items">';
          groups[m].forEach(function (item) {
            var act = item.id === activeId ? " active" : "";
            var dateLabel = formatDateShort(item.date);
            var sessClass = item.session === "morning" ? "session-morning" : "session-evening";
            var sessText = item.session === "morning" ? "개장" : "마감";
            html += '<button type="button" class="nav-item' + act + '" data-id="' + item.id + '">' +
              '<div class="item-top">' +
                '<span class="item-date">' + dateLabel + '</span>' +
                '<span class="item-session ' + sessClass + '">' + sessText + '</span>' +
              '</div>' +
            '</button>';
          });
          html += '</div></div>';
        });
        reportList.innerHTML = html;

        Array.prototype.forEach.call(reportList.querySelectorAll(".month-toggle"), function (btn) {
          btn.addEventListener("click", function () {
            var group = btn.parentElement;
            var m = group.dataset.month;
            var nextFolded = !group.classList.contains("folded");
            foldedMonths[m] = nextFolded;
            group.classList.toggle("folded", nextFolded);
            btn.setAttribute("aria-expanded", String(!nextFolded));
            var chev = btn.querySelector(".chev");
            if (chev) chev.textContent = nextFolded ? "▸" : "▾";
          });
        });

        Array.prototype.forEach.call(reportList.querySelectorAll(".nav-item"), function (btn) {
          btn.addEventListener("click", function () {
            var found = hubData.find(function (x) { return x.id === btn.dataset.id; });
            selectReport(found);
          });
        });
      }

      Array.prototype.forEach.call(document.querySelectorAll(".filter-btn"), function (btn) {
        btn.addEventListener("click", function () {
          currentFilter = btn.dataset.filter;
          Array.prototype.forEach.call(document.querySelectorAll(".filter-btn"), function (b) {
            b.classList.toggle("active", b === btn);
          });
          renderSidebar();
        });
      });

      fetch("hub-data.json?t=" + Date.now())
        .then(function (r) { return r.json(); })
        .then(function (data) {
          hubData = data || [];
          renderSidebar();
          var hash = window.location.hash.replace("#", "").trim();
          var match = hash ? hubData.find(function (item) { return item.id === hash; }) : null;
          if (match) {
            var m = match.month || (match.date ? match.date.slice(0, 7) : "기타");
            foldedMonths[m] = false;
            renderSidebar();
            selectReport(match);
          } else if (hubData.length) {
            selectReport(hubData[0]);
          }
        })
        .catch(function () {
          reportList.innerHTML = '<div class="empty">브리핑 목록 로드 실패</div>';
        });
    })();
  </script>
</body>
</html>
